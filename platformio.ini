; Unexpected Maker TinyC6 tracked bot — dockerhost thin client (DRV8833).
; Legacy NodeMCU-32S + PS4 stays as env nodemcu-32s (Classic BT, USB only).

[platformio]
default_envs = tracked_wifi_ota
extra_configs =
    platformio_private.ini

; Local PS4 on the old NodeMCU-32S (Classic Bluetooth). No ROS.
[env:nodemcu-32s]
platform = espressif32@6.7.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<tracked_main.cpp> -<tracked_ota.cpp> -<drive_tracks.cpp> -<tracked_tof.cpp> -<tracked_imu.cpp> -<tracked_als.cpp>
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    rfetick/MPU6050_light
    https://github.com/aed3/PS4-esp32.git

[env:tracked_base]
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = um_tinyc6
board_build.f_cpu = 160000000L
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    https://github.com/pololu/vl53l0x-arduino.git
build_src_filter = +<tracked_main.cpp> +<tracked_ota.cpp> +<drive_tracks.cpp> +<tracked_tof.cpp> +<tracked_imu.cpp> +<tracked_als.cpp> +<ir_tx.cpp> +<fleet_ir_rx.cpp> +<tracked_speaker.cpp> -<ps4_main.cpp> -<PS4Controller.cpp> -<DifferentialSteering.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D OLED_ENABLED=1
    -DFLEET_IR_ID=2
    -DFLEET_IR_MATCH_NEED=3

[env:tracked_wifi]
extends = env:tracked_base
extra_scripts =
    pre:extra_scripts/micro_ros_sanitize.py
    pre:extra_scripts/micro_ros_meta_rebuild.py
build_flags =
    ${env:tracked_base.build_flags}
    -DMICRO_ROS_WIFI=1
    ${wifi.build_flags}
board_microros_transport = wifi
board_microros_distro = jazzy
board_microros_user_meta = metas/colcon_tracked.meta

[env:tracked_wifi_ota]
extends = env:tracked_wifi
build_flags =
    ${env:tracked_wifi.build_flags}
    -DENABLE_OTA=1
    ${ota.build_flags}
upload_protocol = espota
upload_port = ${ota.upload_port}
upload_flags =
    --timeout=120

; First flash (and after a new TinyC6) — same firmware as OTA, USB esptool.
; Reuses .pio/libdeps/tracked_wifi_ota/micro_ros_platformio (see extra_scripts).
[env:tracked_wifi_ota_usb]
extends = env:tracked_wifi_ota
upload_protocol = esptool
upload_port =
upload_flags =

[wifi]
build_flags =

[ota]
upload_port = tracked-bot.local
build_flags =
    -DBOT_OTA_HOSTNAME=\"tracked-bot\"
