; Unexpected Maker TinyS3[D] tracked bot — dockerhost thin client (DRV8833).

[platformio]
default_envs = tracked_s3_ota
extra_configs =
    platformio_private.ini

[env:tracked_base]
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = um_tinys3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    https://github.com/pololu/vl53l0x-arduino.git
build_src_filter = +<tracked_main.cpp> +<tracked_ota.cpp> +<drive_tracks.cpp> +<tracked_tof.cpp> +<tracked_imu.cpp> +<tracked_als.cpp> +<ir_tx.cpp> +<fleet_ir_rx.cpp> +<tracked_speaker.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D OLED_ENABLED=1
    -DFLEET_IR_ID=2
    -DFLEET_IR_MATCH_NEED=3

[env:tracked_s3]
extends = env:tracked_base
extra_scripts =
    pre:extra_scripts/micro_ros_sanitize.py
    pre:extra_scripts/micro_ros_meta_rebuild.py
build_flags =
    ${env:tracked_base.build_flags}
    -DMICRO_ROS_WIFI=1
    ${wifi.build_flags}
board_microros_transport = wifi
board_microros_distro = jazzy
board_microros_user_meta = metas/colcon_tracked.meta

[env:tracked_s3_ota]
extends = env:tracked_s3
build_flags =
    ${env:tracked_s3.build_flags}
    -DENABLE_OTA=1
    ${ota.build_flags}
upload_protocol = espota
upload_port = ${ota.upload_port}
upload_flags =
    --timeout=120

; First USB flash (and after partition changes) — same firmware as OTA.
; Reuses .pio/libdeps/tracked_s3_ota/micro_ros_platformio (see extra_scripts).
[env:tracked_s3_usb]
extends = env:tracked_s3_ota
upload_protocol = esptool
upload_port =
upload_flags =

[wifi]
build_flags =

[ota]
upload_port = tracked-bot.local
build_flags =
    -DBOT_OTA_HOSTNAME=\"tracked-bot\"
